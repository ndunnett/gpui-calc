[package]
name = "gpui-calc"
description = "GPUI Calculator"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "f9b69aeff0f043810b7b98c6242663db76611341" }
anyhow = "1.0.100"
rust-embed = { version = "8.9.0", features = ["include-exclude"] }

[[bin]]
name = "gpui-calc"
path = "src/main.rs"

[package.metadata.bundle]
name = "GPUI Calculator"
identifier = "com.ndunnett.gpuicalc"
osx_minimum_system_version = "10.15.7"
